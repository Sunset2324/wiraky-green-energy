<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wiraky Green Energy{% endblock %}</title>
    {% block head %}{% endblock %}
    <style>
        :root { --primary: #2ecc71; --dark: #2c3e50; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--light); color: #333; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid var(--primary); margin-bottom: 20px; }
        h2 { color: var(--dark); margin-top: 0; }
        .btn { background: var(--primary); color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .b-lunas { background: #d4edda; color: #155724; }
        .b-pending { background: #fff3cd; color: #856404; }
        .b-danger { background: #f8d7da; color: #721c24; }
        .b-muted { background: #e9ecef; color: #495057; }
        /* tambahan untuk integrasi standar API */
        .nav { background: var(--dark); padding: 10px 20px; }
        .nav a { color: #ecf0f1; text-decoration: none; margin-right: 18px; font-size: 14px; }
        .nav a:hover { color: var(--primary); }
        .alert { padding: 12px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        .alert-info { background: #d1ecf1; color: #0c5460; }
        .alert-error { background: #f8d7da; color: #721c24; }
        .alert-warn { background: #fff3cd; color: #856404; }
        .btn-sm { width: auto; padding: 5px 10px; font-size: 12px; margin: 2px 0; }
        .btn-gray { background: #7f8c8d; }
        .btn-red { background: #c0392b; }
        .btn-blue { background: #2980b9; }
        .mono { font-family: Consolas, monospace; font-size: 12px; }
        .muted { color: #888; font-size: 13px; }
        .row-muted td { color: #aaa; }
        .row-focus { background: #f0fbf4; }
        td form { display: inline; }
        .qty { width: 90px; margin-bottom: 0; }
        .check { width: auto; margin: 0 8px 0 0; }
        .scroll { overflow-x: auto; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/surveyor">Surveyor</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/whatsapp">WhatsApp</a>
        {% if has_simulator %}<a href="/finance-sim/">Simulator Finance</a>{% endif %}
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
